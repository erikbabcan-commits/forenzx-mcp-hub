# Pre-commit hooks. Never modify forensic data: evidence paths are excluded everywhere.
# Note: hook revisions must be verified by a maintainer on first run (see PHASE1_RESULT).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: |
          (?x)^(
              docs/archive/.*|
              packs/mobile_compromise/manifest\.json
          )$
      - id: end-of-file-fixer
        exclude: ^docs/archive/.*
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
        # Large-file protection: evidence must never enter the repo.
        exclude: ^docs/archive/.*

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Secret detection. Alerts on high-entropy strings / known secret formats.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: |
          (?x)^(
              \.secrets\.baseline|
              docs/archive/.*|
              tests/.*|
              \.env\.example|
              scripts/first_run\.sh
          )$
