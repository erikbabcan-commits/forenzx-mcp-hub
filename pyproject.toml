[tool.poetry]
name = "forenzx-mcp-core"
version = "5.0.0"
description = "ForenZX MCP Hub v5: forensic MCP server, remote MCP registry and operations dashboard"
authors = ["ForenZX Engineering Team <secops@forenzx.local>"]
readme = "README.md"
packages = [
    { include = "core" },
    { include = "packs" },
    { include = "workers" }
]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = ">=0.28,<0.55"}
pydantic = "^2.6.4"
pydantic-settings = "^2.2.1"
docker = "^7.0.0"
httpx = "^0.27.0"
jsonschema = "^4.21.1"
pyyaml = "^6.0.1"
cryptography = "^42.0.5"
pyjwt = "^2.9.0"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
jinja2 = "^3.1.3"
python-multipart = "^0.0.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.6"
ruff = "^0.3.4"
mypy = "^1.9.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "forenzx-mcp-core"
version = "5.0.0"
description = "ForenZX MCP Hub v5: forensic MCP server, remote MCP registry and operations dashboard"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.28.0,<1.0.0",
    "pydantic>=2.6.4,<3.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "docker>=7.0.0,<8.0.0",
    "httpx>=0.27.0,<1.0.0",
    "jsonschema>=4.21.1,<5.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "cryptography>=42.0.5,<47.0.0",
    "pyjwt>=2.9.0,<3.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "jinja2>=3.1.3,<4.0.0",
    "python-multipart>=0.0.9,<1.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
]
ignore = [
    "E501",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true

[tool.poetry.scripts]
forenzx = "core.main:main"

[tool.vercel]
entrypoint = "core.main:app"

