# CI gate — identical to `make verify`. NOT a release pipeline.
name: CI

# PR gate plus optional manual verification of main HEAD (no extra push-trigger cost).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Poetry (pinned for reproducibility)
        run: pipx install poetry==2.5.1

      - name: Require committed poetry.lock
        run: |
          if [ ! -f poetry.lock ]; then
            echo "::error::poetry.lock is missing. CI installs exclusively from the committed lockfile (no in-job resolution). Run 'make lock' locally and commit poetry.lock."
            exit 1
          fi

      - name: Install dependencies (lockfile only)
        run: poetry install --with dev

      - name: Lockfile consistency
        run: poetry check --lock

      - name: Compile check
        run: poetry run python -m compileall -q core packs workers tests scripts

      - name: Lint (ruff)
        run: poetry run ruff check .

      - name: Format check (ruff)
        run: poetry run ruff format --check .

      - name: Type check (mypy)
        run: poetry run mypy core

      - name: Tests (pytest)
        run: poetry run pytest -q

      - name: Security scan
        run: poetry run python scripts/security_scan.py

      - name: Validate docker compose file
        run: docker compose config -q

      - name: Docker image build
        run: docker build -t forenzx-mcp-hub:ci .
