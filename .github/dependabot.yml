version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    # Poetry project: Dependabot reads pyproject/poetry.lock
    groups:
      dev-dependencies:
        patterns: ["pytest*", "ruff*", "mypy*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
