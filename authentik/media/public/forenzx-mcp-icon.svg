<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="iconNeonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8ff3d" />
      <stop offset="100%" stop-color="#a3e635" />
    </linearGradient>
    <linearGradient id="iconCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="iconShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151d2a" />
      <stop offset="100%" stop-color="#07090d" />
    </linearGradient>
    <linearGradient id="iconBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8ff3d" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagon Outer Shield -->
  <polygon points="64,10 114,39 114,89 64,118 14,89 14,39"
           fill="url(#iconShieldGrad)"
           stroke="url(#iconBorderGrad)"
           stroke-width="4.5"
           stroke-linejoin="round"
           filter="url(#iconGlow)" />

  <!-- Forensic Reticle Nodes -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.8" stroke-dasharray="5 3" />
  <circle cx="64" cy="64" r="26" fill="none" stroke="rgba(200, 255, 61, 0.35)" stroke-width="1.4" />

  <!-- F Glyph -->
  <path d="M 40,43 L 59,43 L 59,49 L 48,49 L 48,58 L 57,58 L 57,64 L 48,64 L 48,85 L 40,85 Z"
        fill="#ffffff" />

  <!-- X Glyph in Cyber Neon & Cyan -->
  <path d="M 63,43 L 73,43 L 88,85 L 78,85 Z"
        fill="url(#iconNeonGrad)" />
  <path d="M 88,43 L 78,43 L 63,85 L 73,85 Z"
        fill="url(#iconCyanGrad)" />

  <!-- Central Nexus -->
  <circle cx="75.5" cy="64" r="4" fill="#c8ff3d" filter="url(#iconGlow)" />

  <!-- Tech Dots -->
  <circle cx="110" cy="39" r="3.5" fill="#c8ff3d" />
  <circle cx="18" cy="89" r="3" fill="#38bdf8" />
</svg>
