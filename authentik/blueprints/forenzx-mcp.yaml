# yaml-language-server: $schema=none
version: 1
metadata:
  name: ForenZX MCP Hub Blueprint
  labels:
    forenzx.mcp/managed: "true"
entries:
  - identifiers:
      name: forenzx_admins
    model: authentik_core.group
    attrs:
      name: forenzx_admins
      is_superuser: false

  - identifiers:
      name: forenzx_analysts
    model: authentik_core.group
    attrs:
      name: forenzx_analysts
      is_superuser: false

  - identifiers:
      name: forenzx_auditors
    model: authentik_core.group
    attrs:
      name: forenzx_auditors
      is_superuser: false

  - id: forenzx-scope-roles
    identifiers:
      name: "ForenZX Role Claims"
    model: authentik_providers_oauth2.scopemapping
    attrs:
      name: "ForenZX Role Claims"
      scope_name: "roles"
      description: "Maps user groups to ForenZX roles and tenant organization"
      expression: |
        roles = []
        user_groups = [g.name for g in user.ak_groups.all()]
        if "forenzx_admins" in user_groups or "authentik Admins" in user_groups:
            roles.extend(["admin", "analyst"])
        elif "forenzx_analysts" in user_groups:
            roles.append("analyst")
        elif "forenzx_auditors" in user_groups:
            roles.append("auditor")
        else:
            roles.append("analyst")

        org = "default_org"
        if hasattr(user, "attributes") and isinstance(user.attributes, dict):
            org = user.attributes.get("organization", "default_org")

        return {
            "roles": sorted(list(set(roles))),
            "organization": org
        }

  - id: forenzx-provider
    identifiers:
      name: ForenZX MCP Hub Provider
    model: authentik_providers_oauth2.oauth2provider
    attrs:
      name: ForenZX MCP Hub Provider
      client_id: forenzx-mcp-hub
      client_secret: !Env [AUTHENTIK_FORENZX_CLIENT_SECRET, forenzx-secret-change-me]
      client_type: confidential
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:8000/auth/callback
        - matching_mode: strict
          url: http://127.0.0.1:8000/auth/callback
        - matching_mode: strict
          url: https://mcp.forenzx.local/auth/callback
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
        - !KeyOf forenzx-scope-roles

  - identifiers:
      slug: forenzx-mcp-hub
    model: authentik_core.application
    attrs:
      name: ForenZX MCP Hub
      slug: forenzx-mcp-hub
      provider: !KeyOf forenzx-provider
      meta_launch_url: http://localhost:8000/dashboard
      meta_icon: "/media/forenzx-mcp-icon.svg"

  - identifiers:
      default: true
    model: authentik_brands.brand
    attrs:
      domain: authentik-default
      default: true
      branding_title: "ForenZX MCP Hub"
      branding_logo: "/media/forenzx-mcp-logo.svg"
      branding_favicon: "/media/forenzx-mcp-icon.svg"
